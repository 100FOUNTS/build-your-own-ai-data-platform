[project]
name = "build-your-own-ai-data-platform"
version = "0.1.0"
description = "Capstone exercise: an industrial reliability platform built with the full data + AI stack"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data
    "duckdb>=1.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2",
    "pyiceberg[s3fs,pyarrow,pyiceberg-core]>=0.9",
    # databases
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5",
    "qdrant-client>=1.12",
    # streaming
    "confluent-kafka>=2.6",
    # transformation and orchestration
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    # ML
    "scikit-learn>=1.5",
    "torch>=2.5",
    "mlflow>=2.17",
    "boto3>=1.35",
    # generative AI
    "langgraph>=0.2",
    "mcp>=1.2",
    "httpx>=0.27",
    # backend and security
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "hvac>=2.3",
    # observability
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-psycopg>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "prometheus-client>=0.21",
    "pyyaml>=6",
    # industry challenges (guide/challenges)
    "polars>=1.30", "deltalake>=1.0", "lightgbm>=4.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.7", "mypy>=1.13"]
notebooks = ["jupyterlab>=4.2", "matplotlib>=3.9", "ipykernel>=6.29"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["checks"]
markers = ["bonus: extra exercises", "challenge: industry challenges (guide/challenges)", "slow: takes more than a minute"]
addopts = "-q -p no:cacheprovider -m 'not bonus and not challenge'"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["platform", "checks", "legacy", "services/web", "node_modules", "**/*.md"]

[tool.ruff.lint]
# Explicit, stable set: syntax/style errors (E, W), real errors (F) and sorted imports (I)
select = ["E4", "E7", "E9", "F", "I", "W"]
