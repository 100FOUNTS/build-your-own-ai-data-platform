# The platform's Spark config: the Iceberg catalog "lake" and S3 access are already set up.
# Your jobs only do SparkSession.builder.getOrCreate() and use tables like lake.bronze.readings.
spark.master                                   local[2]
spark.driver.memory                            1g
spark.sql.shuffle.partitions                   4
spark.sql.session.timeZone                     UTC
spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                    rest
spark.sql.catalog.lake.uri                     http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse               s3://warehouse/
spark.sql.catalog.lake.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint             http://seaweedfs:8333
spark.sql.catalog.lake.s3.path-style-access    true
spark.sql.catalog.lake.s3.access-key-id        lakeaccess
spark.sql.catalog.lake.s3.secret-access-key    lakesecret
spark.sql.catalog.lake.client.region           us-east-1
spark.hadoop.fs.s3a.endpoint                   http://seaweedfs:8333
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.access.key                 lakeaccess
spark.hadoop.fs.s3a.secret.key                 lakesecret
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.endpoint.region            us-east-1
